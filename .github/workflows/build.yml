name: Build Multi-Platform

permissions:
  contents: write

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Build macOS'
        required: false
        default: 'true'
        type: boolean
      build_linux:
        description: 'Build Linux'
        required: false
        default: 'true'
        type: boolean
      build_windows:
        description: 'Build Windows'
        required: false
        default: 'true'
        type: boolean

jobs:
  build-macos:
    runs-on: macos-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_macos == true) ||
      (github.event_name != 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build macOS (Universal Binary)
        run: flutter build macos --release
      
      - name: Verify architectures
        run: lipo -archs build/macos/Build/Products/Release/Passgrinder.app/Contents/MacOS/Passgrinder
      
      - name: Create DMG
        run: |
          hdiutil create -volname Passgrinder \
            -srcfolder build/macos/Build/Products/Release/Passgrinder.app \
            -ov -format UDZO Passgrinder-macOS.dmg
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Passgrinder-macOS
          path: Passgrinder-macOS.dmg

  build-linux:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_linux == true) ||
      (github.event_name != 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Linux
        run: flutter build linux --release
      
      - name: Create tarball
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../Passgrinder-Linux.tar.gz *
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Passgrinder-Linux
          path: Passgrinder-Linux.tar.gz

  build-windows:
    runs-on: windows-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.build_windows == true) ||
      (github.event_name != 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Windows
        run: flutter build windows --release
      
      - name: Create ZIP
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Passgrinder-Windows.zip
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Passgrinder-Windows
          path: Passgrinder-Windows.zip

  release:
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    if: |
      always() && 
      github.event_name != 'pull_request' &&
      (needs.build-macos.result == 'success' || needs.build-linux.result == 'success' || needs.build-windows.result == 'success')
    steps:
      - name: Set release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
            echo "name=Release ${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=build-${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT
            echo "name=Build ${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Download macOS artifact
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Passgrinder-macOS
          path: artifacts

      - name: Download Linux artifact
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Passgrinder-Linux
          path: artifacts

      - name: Download Windows artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Passgrinder-Windows
          path: artifacts

      - name: Ensure tag exists
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = '${{ steps.meta.outputs.tag }}';
            const ref = `refs/tags/${tag}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              await github.rest.git.getRef({ owner, repo, ref });
              core.info(`Tag ${tag} already exists.`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Creating tag ${tag} at ${context.sha}`);
                await github.rest.git.createRef({ owner, repo, ref, sha: context.sha });
              } else {
                throw error;
              }
            }

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
